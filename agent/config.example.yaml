model:
  default: gpt-6.1-sol
  provider: openai-codex
  base_url: https://chatgpt.com/backend-api/codex
_config_version: 52
agent:
  reasoning_effort: medium
  # 사각사각은 상담 기록만 한다: 필요 없는 도구는 끈다 (terminal, file, skills, clarify, todo만 사용)
  disabled_toolsets:
    - web
    - search
    - browser
    - computer_use
    - image_gen
    - video_gen
    - video
    - vision
    - tts
    - x_search
    - memory
    - kanban
    - delegation
    - cronjob
    - connections
    - catalog
    - desktop_ui
    - project
terminal:
  home_mode: profile
  # 사각사각 명령(python3 -m sagak)이 쓰는 환경변수. 스킬 선언과 별도로 명시해 둔다.
  env_passthrough:
    - NOTION_API_KEY
    - SAGAK_NOTION_CUSTOMERS_DB
    - SAGAK_NOTION_EVENTS_DB
    - SAGAK_NOTION_CONSULTATIONS_DB
    - SAGAK_OPENAI_STT_KEY
    - SAGAK_STT_MODEL
    - SAGAK_NOTION_PRODUCTS_DB
    - SAGAK_AUDIO_CLIPS
    - SAGAK_NAVER_LOCAL_URL
    - SAGAK_NAVER_CLIENT_ID
    - SAGAK_NAVER_CLIENT_SECRET
    - SAGAK_BUSINESS_FILE   # 업체 설정 파일 위치 (없으면 agent/business.json)
    - SAGAK_DEMO            # 공개 데모 프로필만 1
stt:
  enabled: false   # 녹음은 사각사각 transcribe 명령이 구간 시간과 함께 전사
skills:
  write_approval: true
  # 프로필을 만들 때 깔리는 Hermes 기본 스킬은 끈다. 이름은 프로필 skills/ 폴더 기준 (hermes-agent는 Hermes가 항상 켬)
  disabled:
    - apple-notes
    - github
    - google-workspace
    # ... 나머지 기본 스킬도 같은 식으로
  external_dirs:
    - /path/to/sagak-agent/agent/skills   # 레포 위치에 맞게
telemetry:
  shared_metrics:
    enabled: false
    send: false
    offer_version: 2
platforms:
  telegram:
    enabled: true
    extra:
      # 관리자만 모든 명령. 직원은 아래 명령 + /help·/whoami만 (Hermes 기본 허용) (D49)
      allow_admin_from:
        - "<관리자 텔레그램 ID>"
      user_allowed_commands:
        - new
        - stop
      # 텔레그램 / 메뉴에는 꼭 필요한 것만 (다른 명령도 관리자는 입력하면 동작)
      command_menu:
        priority_mode: replace
        priority: [new, stop, help]
        max_commands: 3
approvals:
  destructive_slash_confirm: false

# 처리 중에 온 메시지는 끊지 말고 차례로 처리 (파일+녹음 연속 전송 대비)
display:
  busy_input_mode: queue
