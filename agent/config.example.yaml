model:
  default: gpt-6.1-sol
  provider: openai-codex
  base_url: https://chatgpt.com/backend-api/codex
_config_version: 52
agent:
  reasoning_effort: medium
  # 사각사각은 상담 기록만 한다: 필요 없는 도구는 끈다 (terminal, file, skills, clarify, todo만 사용)
  disabled_toolsets:
    - web
    - search
    - browser
    - computer_use
    - image_gen
    - video_gen
    - video
    - vision
    - tts
    - x_search
    - memory
    - kanban
    - delegation
    - cronjob
    - connections
    - catalog
    - desktop_ui
    - project
terminal:
  home_mode: profile
  # 사각사각 명령(python3 -m sagak)이 쓰는 환경변수. 스킬 선언과 별도로 명시해 둔다.
  env_passthrough:
    - NOTION_API_KEY
    - SAGAK_NOTION_CUSTOMERS_DB
    - SAGAK_NOTION_EVENTS_DB
    - SAGAK_NOTION_CONSULTATIONS_DB
    - SAGAK_OPENAI_STT_KEY
    - SAGAK_STT_MODEL
stt:
  enabled: false   # 녹음은 사각사각 transcribe 명령이 구간 시간과 함께 전사
skills:
  write_approval: true
  external_dirs:
    - /path/to/sagak-agent/agent/skills
telemetry:
  shared_metrics:
    enabled: false
    send: false
    offer_version: 2
platforms:
  telegram:
    enabled: true
approvals:
  destructive_slash_confirm: false

# 처리 중에 온 메시지는 끊지 말고 차례로 처리 (파일+녹음 연속 전송 대비)
display:
  busy_input_mode: queue
